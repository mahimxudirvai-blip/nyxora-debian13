# nyxora-debian13 — Full Debian 13 GNOME desktop on Fly.io
# App: nyxora-debian13 | Region: sin (Singapore) | 24/7 (no auto-stop)
# VM: 10 CPU / 80 GB RAM (performance).
# NOTE: Fly caps RAM at 8 GB per CPU, so 10 CPU = max 80 GB RAM.
# 128 GB RAM would need 16 CPU. Ask before switching to 16 CPU.
# Volume: debian13_data (500 GB — Fly's max per volume) mounted at /data.
# NOTE: Fly allows max 1 volume per machine and max 500 GB per volume,
# so 1 TB on one machine is NOT possible. 500 GB is the max.
# Ports: SSH 22 -> 2222, RDP 3389 -> 3389.
# Needs a dedicated IPv4 ($2/mo): fly ips allocate-v4 --shared=false -a nyxora-debian13
# Deploy from the laptop (Fly account ariyan-maisha, org maisha-talukder —
# the proven org for performance machines).

app = "nyxora-debian13"
primary_region = "sin"

auto_stop_machines = false
min_machines_running = 1

[[vm]]
  cpu_kind = "performance"
  cpus = 10
  memory_mb = 81920

[[mounts]]
  source = "debian13_data"
  destination = "/data"

[[services]]
  internal_port = 2222
  protocol = "tcp"

  [[services.ports]]
    port = 22

[[services]]
  internal_port = 3389
  protocol = "tcp"

  [[services.ports]]
    port = 3389
